version: '3.8'

services:
  # ===================
  # Message Broker
  # ===================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: otel-lab-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - otel-network

  # ===================
  # OpenTelemetry Collector
  # ===================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
      - "8888:8888"    # Prometheus metrics (collector)
      - "8889:8889"    # Prometheus exporter
      - "55679:55679"  # ZPages (debug)
    depends_on:
      - jaeger
    networks:
      - otel-network

  # ===================
  # Jaeger (Tracing UI)
  # ===================
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger HTTP collector
      - "14250:14250"  # Jaeger gRPC collector
    networks:
      - otel-network

  # ===================
  # Flask API
  # ===================
  flask-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask-api
    command: >
      opentelemetry-instrument
      gunicorn --bind 0.0.0.0:8000
      --workers 2
      --threads 2
      --access-logfile -
      --error-logfile -
      app.main:app
    ports:
      - "8000:8000"
    environment:
      # Celery
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: rpc://
      # OpenTelemetry (auto-instrumentation via opentelemetry-instrument)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: delta
      OTEL_SERVICE_NAME: flask-api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=development,service.version=1.0.0
      OTEL_PYTHON_LOG_CORRELATION: "true"
      OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
      # App
      FLASK_ENV: development
      PYTHONUNBUFFERED: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - otel-network
    volumes:
      - ./app:/app/app:ro

  # ===================
  # Celery Worker
  # ===================
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery-worker
    command: >
      opentelemetry-instrument
      celery -A app.celery_app worker
      --loglevel=info
      --concurrency=2
    environment:
      # Celery
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: rpc://
      # OpenTelemetry (auto-instrumentation via opentelemetry-instrument)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: delta
      OTEL_SERVICE_NAME: celery-worker
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=development,service.version=1.0.0
      OTEL_PYTHON_LOG_CORRELATION: "true"
      OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
      # App
      PYTHONUNBUFFERED: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - otel-network
    volumes:
      - ./app:/app/app:ro

  # ===================
  # Celery Flower (Task Monitor)
  # ===================
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: otel-lab-flower
    command: celery -A app.celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: rpc://
    depends_on:
      - celery-worker
    networks:
      - otel-network

networks:
  otel-network:
    driver: bridge
