global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Application metrics exported by the OTel Collector Prometheus exporter
  - job_name: otel-collector-app-metrics
    static_configs:
      - targets: ["otel-collector:8889"]

  # OTel Collector internal self-monitoring metrics (otelcol_*)
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
